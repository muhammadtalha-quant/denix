input "type:keyboard" {
    xkb_options caps:escape,compose:ralt
}

for_window [app_id="xdg-desktop-portal-gtk"] floating enable, resize set 800 600
for_window [title="^([Pp]icture[-\\s]?[Ii]n[-\\s]?[Pp]icture)(.*)$"] floating enable, resize set 25 ppt 25 ppt
for_window [app_id="dev.noctalia.Noctalia"] floating enable, resize set 1166 694
