# ── App Launchers ──
bindsym Mod4+Return exec footclient
bindsym Mod4+b exec google-chrome
bindsym Mod4+e exec nautilus
bindsym Mod4+c exec codium
bindsym Mod4+semicolon exec localsend_app
bindsym Mod4+n exec obsidian

# ── Window Management ──
bindsym Mod4+q kill
bindsym Mod4+t floating toggle
bindsym Mod4+p sticky toggle
bindsym Mod4+Shift+f fullscreen toggle

# ── Focus (Arrow Keys) ──
bindsym Mod4+Left focus left
bindsym Mod4+Right focus right
bindsym Mod4+Up focus up
bindsym Mod4+Down focus down

# ── Manual Tiling ──
bindsym Mod4+Shift+backslash splith
bindsym Mod4+Shift+minus splitv
bindsym Mod4+w layout toggle tabbed split
bindsym Mod4+a focus parent
bindsym Mod4+z focus child

# ── Resize Mode ──
bindsym Mod4+r mode "resize"
mode "resize" {
    bindsym Left resize shrink width 10px
    bindsym Right resize grow width 10px
    bindsym Up resize shrink height 10px
    bindsym Down resize grow height 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# ── Mouse ──
floating_modifier Mod4 normal

# ── Workspaces: Switch ──
bindsym Mod4+1 workspace number 1
bindsym Mod4+2 workspace number 2
bindsym Mod4+3 workspace number 3
bindsym Mod4+4 workspace number 4
bindsym Mod4+5 workspace number 5
bindsym Mod4+6 workspace number 6
bindsym Mod4+7 workspace number 7
bindsym Mod4+8 workspace number 8
bindsym Mod4+9 workspace number 9

# ── Workspaces: Move + Follow ──
bindsym Mod4+Shift+1 move container to workspace number 1; workspace number 1
bindsym Mod4+Shift+2 move container to workspace number 2; workspace number 2
bindsym Mod4+Shift+3 move container to workspace number 3; workspace number 3
bindsym Mod4+Shift+4 move container to workspace number 4; workspace number 4
bindsym Mod4+Shift+5 move container to workspace number 5; workspace number 5
bindsym Mod4+Shift+6 move container to workspace number 6; workspace number 6
bindsym Mod4+Shift+7 move container to workspace number 7; workspace number 7
bindsym Mod4+Shift+8 move container to workspace number 8; workspace number 8
bindsym Mod4+Shift+9 move container to workspace number 9; workspace number 9

# ── Workspaces: Move Silent ──
bindsym Mod4+Alt+1 move container to workspace number 1
bindsym Mod4+Alt+2 move container to workspace number 2
bindsym Mod4+Alt+3 move container to workspace number 3
bindsym Mod4+Alt+4 move container to workspace number 4
bindsym Mod4+Alt+5 move container to workspace number 5
bindsym Mod4+Alt+6 move container to workspace number 6
bindsym Mod4+Alt+7 move container to workspace number 7
bindsym Mod4+Alt+8 move container to workspace number 8
bindsym Mod4+Alt+9 move container to workspace number 9

# ── Scratchpad ──
bindsym Mod4+s scratchpad show
bindsym Mod4+Shift+s move scratchpad

# ── Window Switcher ──
bindsym Mod1+Tab exec noctalia msg window-switcher

# ── Noctalia / Panels / Utilities ──
bindsym Mod4+space exec noctalia msg panel-toggle launcher
bindsym Mod4+period exec noctalia msg settings-toggle
bindsym Mod4+v exec noctalia msg panel-toggle clipboard
bindsym Mod4+comma exec noctalia msg panel-toggle launcher /e
bindsym --locked XF86AudioMute exec noctalia msg volume-mute
bindsym --locked XF86AudioPlay exec noctalia msg media toggle
bindsym Print exec noctalia msg screenshot-region
bindsym Shift+Print exec noctalia msg screenshot-fullscreen
bindsym Alt+Print exec noctalia msg plugin noctalia/screen_recorder:service all toggle
bindsym Control+Alt+Delete exec noctalia msg panel-toggle session
bindsym Mod4+l exec noctalia msg session lock

# ── Media / Brightness (locked) ──
bindsym --locked XF86AudioRaiseVolume exec noctalia msg volume-up
bindsym --locked XF86AudioLowerVolume exec noctalia msg volume-down
bindsym --locked XF86MonBrightnessUp exec noctalia msg brightness-up
bindsym --locked XF86MonBrightnessDown exec noctalia msg brightness-down
