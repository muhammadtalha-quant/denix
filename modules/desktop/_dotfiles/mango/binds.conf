bind=SUPER,S,toggle_special_tag
bind=SUPER+SHIFT,S,tag_special_tag
bind=SUPER+ALT,S,tag_special_silent


bind=SUPER,Space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,period,spawn,noctalia msg settings-toggle
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,comma,spawn,noctalia msg panel-toggle launcher /e
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=SHIFT,Print,spawn,noctalia msg screenshot-fullscreen
bind=ALT,Print,spawn,noctalia msg plugin noctalia/screen_recorder:service all toggle
bind=CTRL+ALT,Delete,spawn,noctalia msg panel-toggle session
bind=SUPER+SHIFT,L,spawn,noctalia msg session lock

bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
