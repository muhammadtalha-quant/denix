bind=SUPER,E,spawn,nautilus
bind=SUPER,C,spawn,zeditor
bind=SUPER,semicolon,spawn,localsend_app
bind=SUPER,N,spawn,obsidian

bind=SUPER,Q,killclient
bind=SUPER,L,switch_layout
